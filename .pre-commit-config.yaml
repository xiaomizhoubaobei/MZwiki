# pre-commit 钩子配置
# 安装：pip install pre-commit && pre-commit install
# 手动全量运行：pre-commit run --all-files
fail_fast: false
default_stages: [pre-commit]

# 排除依赖锁文件与构建产物，避免被自动修复钩子反复改写
exclude: |
  (?x)^(
    pnpm-lock\.yaml|
    node_modules/|
    dist/|
    .*\.min\.(js|css)
  )$

repos:
  # ---------- 通用文本卫生 ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ---------- 配置文件合法性 ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        # tsconfig 允许注释（JSONC），跳过
        exclude: ^tsconfig.*\.json$

  # 说明：类型检查（等价 `pnpm lint` = `tsc --noEmit`）已从钩子中移除，
  # 改为提交/推送前的人工强制门禁（见 AGENTS.md 1.4 / 10.7）。
  # 原因：钩子会自动装依赖并在慢速镜像下等待，链路过重、易误拦截；
  # 类型检查属于「提交者必须自己确认通过」的硬性要求。
