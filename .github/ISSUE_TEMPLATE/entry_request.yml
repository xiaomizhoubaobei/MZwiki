name: 📖 新词条申请
description: 申请创建一个尚未存在的词条
labels: ["new-entry"]
assignees: []
body:
  - type: input
    id: title
    attributes:
      label: 词条名称
      placeholder: 例如：拓扑绝缘体
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 一级分类
      options:
        - 自然科学
        - 人文历史
        - 工程技术
        - 计算机科学
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 标签（逗号分隔）
      placeholder: 例如：物理, 凝聚态, 量子理论

  - type: textarea
    id: summary
    attributes:
      label: 词条简介
      description: 用一句话说明这个词条讲什么
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 检查
      options:
        - label: 我已搜索确认该词条不存在
          required: true
